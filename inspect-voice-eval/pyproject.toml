[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inspect-voice-eval"
version = "0.1.0"
description = "Inspect extension for black-box voice evaluation"
requires-python = ">=3.10"
dependencies = ["inspect_ai"]

[project.optional-dependencies]
sounddevice = ["sounddevice>=0.5,<0.6", "numpy>=1.24,<3"]
chatterbox = ["chatterbox-tts>=0.1.7,<0.2"]
faster-whisper = ["faster-whisper>=1.2,<2"]
local = [
  "sounddevice>=0.5,<0.6",
  "numpy>=1.24,<3",
  "chatterbox-tts>=0.1.7,<0.2",
  "faster-whisper>=1.2,<2",
]
test = ["pytest", "anyio", "ruff", "mypy"]

[project.entry-points.inspect_ai]
inspect_voice_eval = "inspect_voice_eval._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "D"]
ignore = ["D100", "D103", "D104", "D105", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
  "chatterbox: local Chatterbox smoke tests",
  "faster_whisper: local faster-whisper smoke tests",
  "sounddevice: local sounddevice smoke tests",
]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
